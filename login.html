<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1a; 
            padding: 40px;
            border-radius: 12px;
            width: 500px;
            max-width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-width: 200px; 
            height: auto;
        }

    
        h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #f0f0f0; 
            font-weight: 600;
        }

        .input-group {
            background-color: #3a3a3a;
            border: 1px solid #555;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative; 
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: transparent;
            border: none;
            color: #aaaaaa; 
            font-size: 16px;
            outline: none;
        }

        .input-group .input-field:last-child {
            padding-right: 50px;
        }

        .input-field::placeholder {
            color: #aaaaaa; 
        }

        .input-group .divider-line {
            height: 1px;
            background-color: #555; 
            margin: 0 10px;
        }

        .input-group:focus-within {
            border-color: #007aff; 
            box-shadow: 0 0 0 1px #007aff; 
        }

        .input-arrow {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .input-group:focus-within .input-arrow {
            color: #007aff;
        }

        .email-display {
            text-align: left;
            padding: 14px 16px 0 16px;
            font-size: 16px;
            color: #aaaaaa; 
        }
        .email-display p {
            margin: 0;
            padding-bottom: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 30px;
            font-size: 14px;
            color: #ccc; 
        }

        .checkbox-container input[type="checkbox"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #3a3a3a;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .checkbox-container input[type="checkbox"]:checked {
            background-color: #007aff;
            border-color: #007aff;
        }

        .checkbox-container input[type="checkbox"]:checked::after {
            content: '✔';
            color: #fff;
            font-size: 14px;
        }

        .link-button {
            background: none;
            border: none;
            color: #007aff;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            margin: 15px 0;
            transition: text-decoration 0.2s ease;
        }

        .link-button:hover {
            text-decoration: underline;
        }

        .link-button .arrow {
            display: inline-block;
            margin-left: 5px;
            font-size: 14px;
            transform: translateY(1px);
        }

        #message {
            height: 30px;
            color: red;
            text-align: center;
            font-family: fantasy New, 'Courier', monospace;
            margin-top: 10px;
        }

        #custom-alert {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: Arial, sans-serif;
        }

        .alert-box {
            background: #1c1c1c;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 320px;
            width: 90%;
            color: #61a0ff;
            font-size: 18px;
        }

        #alert-ok {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #61a0ff;
            border: none;
            border-radius: 6px;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #alert-ok:hover {
            background-color: #3a6fcc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="New folder/image 4.png" alt="Your Custom Logo" />
        </div>
        <h2>Sign in with Apple Account</h2> <form id="sign-in-form">

            <div id="email-step">
                <div class="input-group">
                    <input type="text" id="email" class="input-field" placeholder="Email or Phone Number" />
                    <span class="input-arrow" id="email-arrow">&rarr;</span>
                </div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="keepSignedIn">
                    <label for="keepSignedIn">Keep me signed in</label>
                </div>
                
                <a href="#" class="link-button">Forgotten your password? <span class="arrow">&nearr;</span></a>
                <a href="#" class="link-button">Create Apple Account</a>
            </div>

            <div id="password-step" style="display: none;">
                <div class="input-group">
                    <div class="email-display">
                        <p id="displayed-email"></p> </div>
                    <div class="divider-line"></div>
                    <input type="password" id="password" class="input-field" placeholder="Password" />
                    <span class="input-arrow" id="password-arrow">&rarr;</span>
                </div>
                
                <a href="#" class="link-button">Forgot Apple ID or password?</a>
            </div>
            
            <div id="message"></div>
        </form>
    </div>

    <div id="custom-alert">
        <div class="alert-box">
            <p>Login successfully</p>
            <button id="alert-ok">OK</button>
        </div>
    </div>

    <script>
        const validUser = 'france'; 
        const validPass = 'villalon'; 

        const emailStep = document.getElementById('email-step');
        const passwordStep = document.getElementById('password-step');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const displayedEmail = document.getElementById('displayed-email');
        const emailArrow = document.getElementById('email-arrow');
        const passwordArrow = document.getElementById('password-arrow');
        const messageDiv = document.getElementById('message');
        const customAlert = document.getElementById('custom-alert');
        const alertOk = document.getElementById('alert-ok');

        let currentStep = 1; 

        function goToNextStep() {
            const enteredEmail = emailInput.value.trim();
            messageDiv.textContent = '';

            if (enteredEmail === '') {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Please enter your email or phone number.';
                return;
            }

            if (enteredEmail.toLowerCase() === validUser.toLowerCase()) {
                emailStep.style.display = 'none';
                displayedEmail.textContent = enteredEmail; 
                passwordStep.style.display = 'block'; 
                passwordInput.focus(); 
                currentStep = 2;
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'This email or phone number is not valid.';
            }
        }

        function submitPassword() {
            const enteredPassword = passwordInput.value.trim();
            messageDiv.textContent = '';

            if (enteredPassword === '') {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Please enter your password.';
                return;
            }

         
            if (displayedEmail.textContent.toLowerCase() === validUser.toLowerCase() && enteredPassword === validPass) {
                customAlert.style.display = 'flex'; 
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Incorrect password. Please try again.';
            }
        }

        emailArrow.addEventListener('click', goToNextStep);

        emailInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                goToNextStep();
            }
        });

        passwordArrow.addEventListener('click', submitPassword);

        passwordInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitPassword();
            }
        });

        alertOk.addEventListener('click', function() {
            customAlert.style.display = 'none';
            window.location.href = 'ee.html'; 
        });
    </script>
</body>
</html>
